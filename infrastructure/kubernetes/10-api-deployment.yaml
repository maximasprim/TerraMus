apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmplatform-api
  namespace: farmplatform
  labels: { app: farmplatform-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: farmplatform-api }
  template:
    metadata:
      labels: { app: farmplatform-api }
    spec:
      containers:
        - name: api
          image: REPLACE_WITH_ECR_OR_REGISTRY_IMAGE:TAG
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: farmplatform-api-config }
            - secretRef: { name: farmplatform-api-secrets }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
      initContainers:
        - name: migrate
          image: REPLACE_WITH_ECR_OR_REGISTRY_IMAGE:TAG
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: farmplatform-api-config }
            - secretRef: { name: farmplatform-api-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: farmplatform-api
  namespace: farmplatform
spec:
  selector: { app: farmplatform-api }
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: farmplatform-api
  namespace: farmplatform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: farmplatform-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
