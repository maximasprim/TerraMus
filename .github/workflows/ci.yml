name: CI

# Spec §48-49 - runs the real test suite (Alembic migrations + pytest, not a
# lint-only check) on every push/PR, using the same Postgres version as
# docker-compose.yml so CI and local dev can't silently drift apart.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farm
          POSTGRES_PASSWORD: farm
          POSTGRES_DB: farmdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farm -d farmdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip install --disable-pip-version-check asyncpg

      - name: Run database migrations (smoke test - also run per-test by pytest itself)
        env:
          DATABASE_URL: postgresql+psycopg://farm:farm@localhost:5432/farmdb_test
        run: alembic upgrade head

      - name: Run test suite
        # Note: tests/conftest.py hardcodes its target database (farmdb_test)
        # rather than reading DATABASE_URL - this env var isn't actually
        # consumed by the test run itself. It's set anyway so the app's
        # Settings() default resolves to *something* connectable at import
        # time (engine creation is lazy, so this never gets used for a real
        # query, but setting it avoids relying on that being true forever).
        env:
          DATABASE_URL: postgresql+psycopg://farm:farm@localhost:5432/farmdb_test
          JWT_SECRET: ci-test-secret-not-for-production
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image (build-only - no push; a real deployment
          pipeline would push to a registry here with proper tagging)
        run: docker build -t farmplatform-api:ci ./apps/api
